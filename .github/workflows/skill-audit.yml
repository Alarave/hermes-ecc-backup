name: Skill Lint & Quality Gate

on:
  push:
    branches: [ main, firman ]
  pull_request:
    branches: [ main, firman ]

jobs:
  audit-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pram Quality & Security Audit
        run: |
          python scripts/audit_incoming_skills.py
